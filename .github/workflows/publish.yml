name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 0.2.0 or v0.2.0)"
        required: false
        type: string

jobs:
  create-release-branch:
    name: Create release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push release branch
        run: |
          TAG="${{ github.event.release.tag_name || inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" 2>/dev/null || grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          fi
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "Error: Version could not be determined."
            exit 1
          fi
          BRANCH_NAME="release/v${VERSION}"
          echo "Target release branch: $BRANCH_NAME"

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch '$BRANCH_NAME' already exists on remote origin. Skipping creation."
          else
            echo "Creating and pushing branch '$BRANCH_NAME'..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
            echo "Successfully created and pushed branch '$BRANCH_NAME'."
          fi

  pypi-publish:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    needs: [create-release-branch]
    if: github.event_name == 'release'
    
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
